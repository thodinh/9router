services:
  9router:
    # Build the image from this checkout instead of pulling the published image.
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router:source
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: 9router-cloudflared
    restart: always
    # The tunnel is managed remotely by Cloudflare. The host network lets a
    # dashboard route of http://localhost:20128 reach the published 9Router
    # service. The host alias also keeps http://9router:20128 routes working.
    network_mode: host
    extra_hosts:
      - "9router:127.0.0.1"
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --edge-ip-version
      - "4"
      - --metrics
      - 127.0.0.1:0
      - run
      - --token
      - ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is required in .env}
      - --url
      - http://127.0.0.1:20128
    depends_on:
      9router:
        condition: service_started

volumes:
  9router-data:
    name: 9router-data
